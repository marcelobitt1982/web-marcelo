<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Marcelo - Portal</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #161616;
            --text-color: #ffffff;
            --accent-games: #8b5cf6;
            --accent-radio: #ec4899;
            --accent-recipes: #10b981;
            --accent-sable: #3b82f6;
            --accent-pacman: #ffd000;
            --accent-batalha: #a855f7;
            --accent-sokoban: #f97316;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 550px;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .section-title {
            font-size: 1.3rem;
            margin: 30px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #262626;
            display: flex;
            align-items: center;
        }

        .menu-banner-img {
            max-height: 60px;
            width: auto;
            object-fit: contain;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s, background-color 0.2s;
            border-left: 5px solid transparent;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: #242424;
        }

        /* Botão com imagem inteira e luz de neon */
        .card-image-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            border-radius: 14px;
            background-color: #0a0a0a;
            text-decoration: none;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card-image-btn:hover {
            transform: translateY(-4px);
        }

        /* Neon Rádio (Rosa) */
        .radio-btn {
            border: 2px solid #ff2a85;
            box-shadow:
                0 0 8px rgba(255, 42, 133, 0.55),
                0 0 18px rgba(255, 42, 133, 0.3),
                inset 0 0 10px rgba(255, 42, 133, 0.2);
        }
        .radio-btn:hover {
            border-color: #ff66a8;
            box-shadow:
                0 0 12px rgba(255, 42, 133, 0.9),
                0 0 28px rgba(255, 42, 133, 0.65),
                0 0 42px rgba(255, 42, 133, 0.35),
                inset 0 0 14px rgba(255, 42, 133, 0.35);
        }

        /* Neon Receitas (Verde) */
        .recipes-btn {
            border: 2px solid #00ff9d;
            box-shadow:
                0 0 8px rgba(0, 255, 157, 0.55),
                0 0 18px rgba(0, 255, 157, 0.3),
                inset 0 0 10px rgba(0, 255, 157, 0.2);
        }
        .recipes-btn:hover {
            border-color: #66ffc4;
            box-shadow:
                0 0 12px rgba(0, 255, 157, 0.9),
                0 0 28px rgba(0, 255, 157, 0.65),
                0 0 42px rgba(0, 255, 157, 0.35),
                inset 0 0 14px rgba(0, 255, 157, 0.35);
        }

        /* Neon Sabre Laser (Azul) */
        .sable-btn {
            border: 2px solid #00a2ff;
            box-shadow:
                0 0 8px rgba(0, 162, 255, 0.55),
                0 0 18px rgba(0, 162, 255, 0.3),
                inset 0 0 10px rgba(0, 162, 255, 0.2);
        }
        .sable-btn:hover {
            border-color: #66c5ff;
            box-shadow:
                0 0 12px rgba(0, 162, 255, 0.9),
                0 0 28px rgba(0, 162, 255, 0.65),
                0 0 42px rgba(0, 162, 255, 0.35),
                inset 0 0 14px rgba(0, 162, 255, 0.35);
        }

        /* Neon Pac-Man (Amarelo) */
        .pacman-btn {
            border: 2px solid #ffd000;
            box-shadow:
                0 0 8px rgba(255, 208, 0, 0.55),
                0 0 18px rgba(255, 208, 0, 0.3),
                inset 0 0 10px rgba(255, 208, 0, 0.2);
        }
        .pacman-btn:hover {
            border-color: #ffe466;
            box-shadow:
                0 0 12px rgba(255, 208, 0, 0.9),
                0 0 28px rgba(255, 208, 0, 0.65),
                0 0 42px rgba(255, 208, 0, 0.35),
                inset 0 0 14px rgba(255, 208, 0, 0.35);
        }

        /* Neon Batalha (Roxo) */
        .batalha-btn {
            border: 2px solid #b84dff;
            box-shadow:
                0 0 8px rgba(184, 77, 255, 0.55),
                0 0 18px rgba(184, 77, 255, 0.3),
                inset 0 0 10px rgba(184, 77, 255, 0.2);
        }
        .batalha-btn:hover {
            border-color: #d494ff;
            box-shadow:
                0 0 12px rgba(184, 77, 255, 0.9),
                0 0 28px rgba(184, 77, 255, 0.65),
                0 0 42px rgba(184, 77, 255, 0.35),
                inset 0 0 14px rgba(184, 77, 255, 0.35);
        }

        /* Neon Sokoban (Laranja) */
        .sokoban-btn {
            border: 2px solid #ff7b00;
            box-shadow:
                0 0 8px rgba(255, 123, 0, 0.55),
                0 0 18px rgba(255, 123, 0, 0.3),
                inset 0 0 10px rgba(255, 123, 0, 0.2);
        }
        .sokoban-btn:hover {
            border-color: #ffa64d;
            box-shadow:
                0 0 12px rgba(255, 123, 0, 0.9),
                0 0 28px rgba(255, 123, 0, 0.65),
                0 0 42px rgba(255, 123, 0, 0.35),
                inset 0 0 14px rgba(255, 123, 0, 0.35);
        }

        /* Garante que a imagem apareça inteira sem cortes */
        .card-image-btn img {
            max-width: 100%;
            max-height: 150px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }

        .game { border-left-color: var(--accent-games); }

        .icon {
            font-size: 1.5rem;
        }
    </style>
</head>
