<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Marcelo - Portal</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #161616;
            --text-color: #ffffff;
            --accent-games: #8b5cf6;
            --accent-radio: #ec4899;
            --accent-recipes: #10b981;
            --accent-sable: #3b82f6;
            --accent-pacman: #ffd000;
            --accent-batalha: #a855f7;
            --accent-sokoban: #f97316;
            --accent-billard: #06b6d4;
            --accent-chess: #a855f7;
        }

        /* Canvas de ondas animadas ao fundo */
        #waves-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Logo / Vídeo em tamanho compacto ideal para celular */
        .dj-video-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 240px;
            margin: 0 auto 10px auto;
            border-radius: 16px;
            overflow: hidden;
            background-color: rgba(10, 10, 10, 0.75);
        }

        .dj-video {
            width: 100%;
            max-height: 220px;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* Logo / escrita "Web Marcelo" pequena e proporcional abaixo do vídeo */
        .sub-logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 175px;
            margin: 0 auto 22px auto;
        }

        .sub-logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .audio-player-container {
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .dj-video-wrapper {
                max-width: 190px;
                margin-bottom: 8px;
            }

            .dj-video {
                max-height: 180px;
            }

            .sub-logo-wrapper {
                max-width: 145px;
                margin-bottom: 18px;
            }
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .section-title {
            font-size: 1.15rem;
            margin: 24px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
        }

        .menu-banner-img {
            max-height: 48px;
            width: auto;
            object-fit: contain;
        }

        /* Grade mais compacta para ícones/botões menores */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 12px;
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
                gap: 10px;
            }
        }

        .card {
            background-color: rgba(22, 22, 22, 0.85);
            padding: 12px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.2s;
            border-left: 4px solid transparent;
        }

        .card:hover {
            transform: translateY(-3px);
            background-color: #242424;
        }

        /* Botão com imagem inteira e luz de neon em tamanho reduzido */
        .card-image-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
            border-radius: 12px;
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(4px);
            text-decoration: none;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card-image-btn:hover {
            transform: translateY(-3px);
        }

        /* Neon Rádio (Rosa) */
        .radio-btn {
            border: 2px solid #ff2a85;
            box-shadow:
                0 0 6px rgba(255, 42, 133, 0.55),
                0 0 14px rgba(255, 42, 133, 0.3),
                inset 0 0 8px rgba(255, 42, 133, 0.2);
        }
        .radio-btn:hover {
            border-color: #ff66a8;
            box-shadow:
                0 0 10px rgba(255, 42, 133, 0.9),
                0 0 22px rgba(255, 42, 133, 0.65),
                0 0 34px rgba(255, 42, 133, 0.35),
                inset 0 0 12px rgba(255, 42, 133, 0.35);
        }

        /* Neon Receitas (Verde) */
        .recipes-btn {
            border: 2px solid #00ff9d;
            box-shadow:
                0 0 6px rgba(0, 255, 157, 0.55),
                0 0 14px rgba(0, 255, 157, 0.3),
                inset 0 0 8px rgba(0, 255, 157, 0.2);
        }
        .recipes-btn:hover {
            border-color: #66ffc4;
            box-shadow:
                0 0 10px rgba(0, 255, 157, 0.9),
                0 0 22px rgba(0, 255, 157, 0.65),
                0 0 34px rgba(0, 255, 157, 0.35),
                inset 0 0 12px rgba(0, 255, 157, 0.35);
        }

        /* Neon Sabre Laser (Azul) */
        .sable-btn {
            border: 2px solid #00a2ff;
            box-shadow:
                0 0 6px rgba(0, 162, 255, 0.55),
                0 0 14px rgba(0, 162, 255, 0.3),
                inset 0 0 8px rgba(0, 162, 255, 0.2);
        }
        .sable-btn:hover {
            border-color: #66c5ff;
            box-shadow:
                0 0 10px rgba(0, 162, 255, 0.9),
                0 0 22px rgba(0, 162, 255, 0.65),
                0 0 34px rgba(0, 162, 255, 0.35),
                inset 0 0 12px rgba(0, 162, 255, 0.35);
        }

        /* Neon Pac-Man (Amarelo) */
        .pacman-btn {
            border: 2px solid #ffd000;
            box-shadow:
                0 0 6px rgba(255, 208, 0, 0.55),
                0 0 14px rgba(255, 208, 0, 0.3),
                inset 0 0 8px rgba(255, 208, 0, 0.2);
        }
        .pacman-btn:hover {
            border-color: #ffe466;
            box-shadow:
                0 0 10px rgba(255, 208, 0, 0.9),
                0 0 22px rgba(255, 208, 0, 0.65),
                0 0 34px rgba(255, 208, 0, 0.35),
                inset 0 0 12px rgba(255, 208, 0, 0.35);
        }

        /* Neon Batalha (Roxo) */
        .batalha-btn {
            border: 2px solid #b84dff;
            box-shadow:
                0 0 6px rgba(184, 77, 255, 0.55),
                0 0 14px rgba(184, 77, 255, 0.3),
                inset 0 0 8px rgba(184, 77, 255, 0.2);
        }
        .batalha-btn:hover {
            border-color: #d494ff;
            box-shadow:
                0 0 10px rgba(184, 77, 255, 0.9),
                0 0 22px rgba(184, 77, 255, 0.65),
                0 0 34px rgba(184, 77, 255, 0.35),
                inset 0 0 12px rgba(184, 77, 255, 0.35);
        }

        /* Neon Sokoban (Laranja) */
        .sokoban-btn {
            border: 2px solid #ff7b00;
            box-shadow:
                0 0 6px rgba(255, 123, 0, 0.55),
                0 0 14px rgba(255, 123, 0, 0.3),
                inset 0 0 8px rgba(255, 123, 0, 0.2);
        }
        .sokoban-btn:hover {
            border-color: #ffa64d;
            box-shadow:
                0 0 10px rgba(255, 123, 0, 0.9),
                0 0 22px rgba(255, 123, 0, 0.65),
                0 0 34px rgba(255, 123, 0, 0.35),
                inset 0 0 12px rgba(255, 123, 0, 0.35);
        }

        /* Neon Billard (Ciano) */
        .billard-btn {
            border: 2px solid #00e5ff;
            box-shadow:
                0 0 6px rgba(0, 229, 255, 0.55),
                0 0 14px rgba(0, 229, 255, 0.3),
                inset 0 0 8px rgba(0, 229, 255, 0.2);
        }
        .billard-btn:hover {
            border-color: #70f2ff;
            box-shadow:
                0 0 10px rgba(0, 229, 255, 0.9),
                0 0 22px rgba(0, 229, 255, 0.65),
                0 0 34px rgba(0, 229, 255, 0.35),
                inset 0 0 12px rgba(0, 229, 255, 0.35);
        }

        /* Neon Xadrez (Violeta) */
        .chess-btn {
            border: 2px solid #a855f7;
            box-shadow:
                0 0 6px rgba(168, 85, 247, 0.55),
                0 0 14px rgba(168, 85, 247, 0.3),
                inset 0 0 8px rgba(168, 85, 247, 0.2);
        }
        .chess-btn:hover {
            border-color: #c896ff;
            box-shadow:
                0 0 10px rgba(168, 85, 247, 0.9),
                0 0 22px rgba(168, 85, 247, 0.65),
                0 0 34px rgba(168, 85, 247, 0.35),
                inset 0 0 12px rgba(168, 85, 247, 0.35);
        }

        /* Garante que a imagem apareça inteira sem cortes em tamanho menor */
        .card-image-btn img {
            max-width: 100%;
            max-height: 92px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 7px;
            display: block;
        }

        @media (max-width: 480px) {
            .card-image-btn img {
                max-height: 78px;
            }
        }

        .game { border-left-color: var(--accent-games); }

        .icon {
            font-size: 1.15rem;
        }
    </style>
</head>
<body>
    <canvas id="waves-bg" aria-hidden="true"></canvas>

    <div class="dj-video-wrapper">
        <video class="dj-video" autoplay loop muted playsinline>
          <source src="marcelo.mp4" type="video/mp4">
        </video>
    </div>

    <div class="sub-logo-wrapper">
        <img src="logo.jpeg" alt="Web Marcelo" class="sub-logo-img">
    </div>

    <!-- Player de Áudio com a opção de repetição contínua (loop) -->
    <div class="audio-player-container">
        <audio controls loop>
          <source src="audio/funk.mp3" type="audio/mpeg">
          Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <div class="container">

        <div class="grid">
            <!-- BOTÃO RÁDIO -->
            <a href="https://radiodjmarcelo.pages.dev/" target="_blank" class="card-image-btn radio-btn">
                <img src="radio.jpeg" alt="Rádio">
            </a>

            <!-- BOTÃO RECEITAS -->
            <a href="https://marcelobitt1982.github.io/receitas-do-marcelo/index.html" target="_blank" class="card-image-btn recipes-btn">
                <img src="receitas.jpeg" alt="Receitas">
            </a>

            <!-- BOTÃO SABLE LASER -->
            <a href="https://padawan-odyssee.pages.dev/" target="_blank" class="card-image-btn sable-btn">
                <img src="sabre.jpeg" alt="Sable Laser">
            </a>
        </div>

        <div class="section-title">🎮 JOGOS</div>
        <div class="grid">
            <!-- JOGO 1: PAC-MAN -->
            <a href="https://marcelobitt1982.github.io/PAC-MAN-MARCELO/" target="_blank" class="card-image-btn pacman-btn">
                <img src="pacman.jpeg" alt="PAC-MAN MARCELO">
            </a>

            <!-- JOGO 2: BATALHA -->
            <a href="https://marcelobitt1982.github.io/batalha-naval/" target="_blank" class="card-image-btn batalha-btn">
                <img src="batalha.jpeg" alt="Batalha">
            </a>

            <!-- JOGO 3: SOKOBAN -->
            <a href="https://marcelobitt1982.github.io/jogo-das-caixas/" target="_blank" class="card-image-btn sokoban-btn">
                <img src="sokoban.jpeg" alt="Sokoban - Jogo das Caixas">
            </a>

            <!-- JOGO 4: BILLARD -->
            <a href="https://marcelobitt1982.github.io/billard-marcelo/" target="_blank" class="card-image-btn billard-btn">
                <img src="billard.jpeg" alt="Billard Marcelo">
            </a>

            <!-- JOGO 5: XADREZ -->
            <a href="https://marcelo-chess.pages.dev/" target="_blank" class="card-image-btn chess-btn">
                <img src="xadrez.jpeg" alt="Xadrez Marcelo">
            </a>

            <a href="https://marcelobitt1982.github.io/marcelo-race/" target="_blank" class="card-image-btn chess-btn">
                <img src="enduro.jpeg" alt="Enduro Marcelo">
            </a>

            <a href="https://marcelobitt1982.github.io/marcelo-ludo/" target="_blank" class="card-image-btn chess-btn">
                <img src="ludo.jpeg" alt="Ludo Marcelo">
            </a>

            <a href="https://marcelobitt1982.github.io/jogo-da-cobrinha/" target="_blank" class="card-image-btn chess-btn">
                <img src="snake.jpeg" alt="Cobrinha Marcelo">
            </a>
        </div>

    </div>

    <script>
        (function () {
            const canvas = document.getElementById('waves-bg');
            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            let time = 0;

            const waves = [
                {
                    baseY: 0.72,
                    amplitude: 28,
                    frequency: 0.0055,
                    speed: 0.016,
                    phase: 0,
                    color: 'rgba(168, 85, 247, 0.24)',
                    lineWidth: 2
                },
                {
                    baseY: 0.78,
                    amplitude: 34,
                    frequency: 0.0042,
                    speed: 0.012,
                    phase: 1.8,
                    color: 'rgba(255, 42, 133, 0.22)',
                    lineWidth: 2
                },
                {
                    baseY: 0.84,
                    amplitude: 24,
                    frequency: 0.0068,
                    speed: 0.02,
                    phase: 3.4,
                    color: 'rgba(0, 229, 255, 0.22)',
                    lineWidth: 1.75
                },
                {
                    baseY: 0.90,
                    amplitude: 30,
                    frequency: 0.005,
                    speed: 0.014,
                    phase: 5.0,
                    color: 'rgba(0, 255, 157, 0.18)',
                    lineWidth: 1.5
                }
            ];

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function drawWaves() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                // Brilho ambiente sutil no fundo preto
                const glow = ctx.createRadialGradient(
                    width * 0.5,
                    height * 0.85,
                    20,
                    width * 0.5,
                    height * 0.85,
                    Math.max(width, height) * 0.65
                );
                glow.addColorStop(0, 'rgba(139, 92, 246, 0.10)');
                glow.addColorStop(0.5, 'rgba(236, 72, 153, 0.05)');
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);

                const step = width < 480 ? 8 : 12;

                waves.forEach((wave) => {
                    ctx.beginPath();
                    const originY = height * wave.baseY;

                    for (let x = 0; x <= width + step; x += step) {
                        const y =
                            originY +
                            Math.sin(x * wave.frequency + time * wave.speed + wave.phase) * wave.amplitude +
                            Math.cos(x * wave.frequency * 0.5 - time * wave.speed * 0.7) * (wave.amplitude * 0.35);

                        if (x === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }

                    ctx.strokeStyle = wave.color;
                    ctx.lineWidth = wave.lineWidth;
                    ctx.stroke();

                    // Preenchimento suave abaixo de cada linha de onda
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.closePath();

                    const fillGrad = ctx.createLinearGradient(0, originY - wave.amplitude, 0, height);
                    fillGrad.addColorStop(0, wave.color.replace(/0\.\d+\)$/, '0.07)'));
                    fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = fillGrad;
                    ctx.fill();
                });

                time += 1;
                requestAnimationFrame(drawWaves);
            }

            window.addEventListener('resize', resize);
            resize();
            drawWaves();
        })();
    </script>
</body>
</html>
